<div class="commands">
  <button (click)="uploadImage()" [disabled]="!imageFile">Invia immagine</button>
  <button (click)="goToHome()">Ritorna alla home</button>
  <button (click)="reset()">Reset ordine</button>
  <button (click)="close()">Chiudi ordini</button>
</div>

<div *ngIf="toastMessage" [ngClass]="{'toast-error': toastError, 'toast-success': !toastError}" class="toast">
  {{ toastMessage }}
</div>

<div class="admin-body">
  <div
    tabindex="0"
    (paste)="onPaste($event)"
    (dragover)="onDragOver($event)"
    (drop)="onDrop($event)"
    class="upload-space"
  >
    <img [src]="imageSrc" style="max-width:100%; max-height:800px;">
    <div>
      Incolla o trascina qui l'immagine del men&ugrave; (CTRL+V o Drag&Drop)
    </div>
  </div>

  <div class="users">
    <h3>Utenti</h3>
    <ul>
      <li *ngFor="let user of users" [ngClass]="{'inactive': !user.active}">
        <span class="user-name">{{ user.name }}</span>
        <span class="user-actions">
          <label>
            <input type="checkbox" [checked]="user.active" (change)="toggleActive(user)">
            Attivo
          </label>
          <button (click)="deleteUser(user)">Cancella</button>
        </span>
      </li>
    </ul>
    <div class="new-user">
      <input
        type="text"
        placeholder="Nome nuovo utente"
        [(ngModel)]="newUserName"
        (keyup.enter)="createUser()">
      <button (click)="createUser()" [disabled]="!newUserName.trim()">Aggiungi</button>
    </div>
  </div>
</div>
